name: Tests

on:
  pull_request:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m py_compile custom_components/solar_load_controller/*.py

      - name: Check translations
        run: |
          python -m json.tool custom_components/solar_load_controller/translations/de.json
          python -m json.tool custom_components/solar_load_controller/translations/en.json

      - name: Run tests
        run: python -m pytest tests
