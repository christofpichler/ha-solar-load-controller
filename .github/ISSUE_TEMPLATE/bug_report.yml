name: Bug report
description: Report unexpected switching behavior, setup problems, or runtime issues.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue.

        If this is about switching behavior, enable the debug sensor in the integration options and include the relevant lines from `/config/solar_load_controller_decisions.jsonl`.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
      placeholder: The load switched on although there was no PV surplus...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: The load should have stayed off because...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.5.0
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - HACS custom repository
        - Manual custom_components copy
        - Other
    validations:
      required: true

  - type: dropdown
    id: forecast_integration
    attributes:
      label: PV forecast integration
      options:
        - Solcast by BJReplay
        - Other
        - "None"
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Solar/load setup
      description: Include the values that influence the decision engine.
      placeholder: |
        PV size: 1.8 kWp
        Inverter limit: 1000 W
        Battery size / mode: 4.8 kWh / use battery
        Controlled load: pool pump
        Load power: 450 W
        Grid import limit: 700 W
        Minimum runtime: 180 min
        Allowed time window: 06:00-22:00
    validations:
      required: true

  - type: textarea
    id: relevant_entities
    attributes:
      label: Relevant entity values
      description: Paste the values from the time of the problem if available.
      placeholder: |
        decision_reason:
        forecast_day_mode:
        forecast_day_mode_override:
        grid_import:
        grid_export:
        pv_current_power:
        forecast_today:
        forecast_remaining_today:
        forecast_next_hour:
        battery_soc:
        battery_power:
        load switch state:
    validations:
      required: false

  - type: textarea
    id: debug_log
    attributes:
      label: Decision debug log
      description: Paste the relevant JSONL lines around the problem time.
    validations:
      required: false

  - type: textarea
    id: ha_logs
    attributes:
      label: Home Assistant logs
      description: Paste warnings/errors from Home Assistant logs if there are any.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, automations, entity history, or anything else that helps.
    validations:
      required: false
